<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="faceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a6118;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a2c08;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a07d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a4410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3410;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1608;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Drop shadow group -->
  <g filter="url(#shadow)">

    <!-- d20 shape: icosahedron face-on view -->
    <!-- Outer pentagon boundary (the full die silhouette) -->
    <!-- Top face (brightest) -->
    <polygon
      points="50,8 74,28 65,55 35,55 26,28"
      fill="url(#faceTop)"
      stroke="#f0c040"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Left upper face -->
    <polygon
      points="26,28 35,55 14,68 8,42"
      fill="url(#faceLeft)"
      stroke="#c9a227"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Right upper face -->
    <polygon
      points="74,28 92,42 86,68 65,55"
      fill="url(#faceRight)"
      stroke="#c9a227"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Left lower face -->
    <polygon
      points="14,68 35,55 50,78 28,88"
      fill="url(#faceLeft)"
      stroke="#7a6118"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Bottom center face -->
    <polygon
      points="35,55 65,55 50,78"
      fill="url(#faceBottom)"
      stroke="#7a6118"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Right lower face -->
    <polygon
      points="65,55 86,68 72,88 50,78"
      fill="url(#faceRight)"
      stroke="#7a6118"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Bottom strip left -->
    <polygon
      points="28,88 50,78 50,94 22,94"
      fill="url(#faceBottom)"
      stroke="#3a2c08"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Bottom strip right -->
    <polygon
      points="50,78 72,88 78,94 50,94"
      fill="url(#faceBottom)"
      stroke="#3a2c08"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Top left cap -->
    <polygon
      points="50,8 26,28 8,18 28,6"
      fill="url(#faceLeft)"
      stroke="#c9a227"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Top right cap -->
    <polygon
      points="50,8 72,6 92,18 74,28"
      fill="url(#faceRight)"
      stroke="#c9a227"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

  </g>

  <!-- "20" numeral on top face, centered in the top polygon -->
  <text
    x="50"
    y="43"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, serif"
    font-size="16"
    font-weight="bold"
    fill="#0a0b0f"
    filter="url(#glow)"
    letter-spacing="1"
  >20</text>

  <!-- Edge highlight on top face for depth -->
  <polyline
    points="50,8 74,28 65,55"
    fill="none"
    stroke="#f8e080"
    stroke-width="0.6"
    stroke-opacity="0.6"
    stroke-linejoin="round"
  />
  <polyline
    points="50,8 26,28"
    fill="none"
    stroke="#f8e080"
    stroke-width="0.6"
    stroke-opacity="0.4"
    stroke-linejoin="round"
  />

</svg>
